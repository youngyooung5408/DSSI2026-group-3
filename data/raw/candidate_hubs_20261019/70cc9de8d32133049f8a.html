084656828788\u0026id=100051818071280"},"xAvkrBwLt63FdqxU7kjn":{"id":"xAvkrBwLt63FdqxU7kjn","mode":"external","url":"https://www.facebook.com/share/p/1Jn8H5AnXj/"},"xg16xYJfFMgyCniBClCR":{"id":"xg16xYJfFMgyCniBClCR","mode":"internal","updatedAt":{"_nanoseconds":466000000,"_seconds":1788773258},"url":"page/Sustainability"},"yPXXG5DGguURfZ9v0lA8":{"id":"yPXXG5DGguURfZ9v0lA8","mode":"external","url":"https://www.facebook.com/share/p/1LNeRYw77W/"},"zGYnDJ2Nr3MBZTjJvvMR":{"id":"zGYnDJ2Nr3MBZTjJvvMR","mode":"external","updatedAt":{"_nanoseconds":160000000,"_seconds":1788326683},"url":"https://www.facebook.com/share/p/1EYsAjoHoV/"}},"locale":"zh","logoUrl":"https://portaly.cc/signup?ref=hammerlee","lowerSlug":"hammerlee","name":"新北市長候選人 李四川","ogDescription":"前新北市、台北市副市長，工程師出身。新北政見內容、訪談影片一次找到。11 月 28 日，新北的事交給做過的人，交給李四川！","ogImage":"https://firebasestorage.googleapis.com/v0/b/portaly-ca9e1.appspot.com/o/Ywf2Uj00rhhzoMmK7HZL%2FogImage?alt=media\u0026token=bea8123e-c49a-4a65-90f2-e260bf46ddc8","ogPostfix":"新北市長候選人|Facebook, Instagram, Threads, 政見內容","ogTitle":"李四川","ownerUserId":"VoyQWMGvmZg6DF1Ltc5R8x7N5Rm2","pages":{"0eYt5Bj2dvMCmMpuQTT2":{"blockOrders":["O4j4LEwO64eNf25CUfSY","M1jVof312fanSSBtyeUt","QPU6DfFoMMfJmhMwIiX2","0VESrD1GohgTIzdcIGBd","Lz2El7gdhFws6SuSWVvm","mzv1jBeVEt3nJHi818ME","Mhc0dFdX9qVleaIPgp77"],"blocks":{"0VESrD1GohgTIzdcIGBd":{"createdAt":{"_nanoseconds":256000000,"_seconds":1789375650},"hidden":false,"id":"0VESrD1GohgTIzdcIGBd","initial":false,"items":[{"alt":"李四川體育政策","cta":true,"description":"\u003ch2 style=\"text-align:left\"\u003e\u003cstrong\u003e運動城市2.0\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e世界來比賽，新北天天動。說實在，一座城市會不會運動，不是看蓋了幾座館，是看禮拜三晚上，館裡面有沒有人在打球。新北現在有 20 座國民運動中心，全台最多。今年《遠見》的運動縣市調查，新北第一次拿到六都第一。這是從朱立倫市長到侯友宜市長這幾年打下的底子。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e接下來，我想再往前推一步——運動城市 2.0。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e第一，新北運動幣\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e一份 500 元，一年 15 萬份。可以買賽事門票、報名運動課程、租借場地、參加指定活動。\u003c/p\u003e\u003cp\u003e錢不算多。但它要買的不只是一次消費，是一個習慣。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e第二，加速興建新北巨蛋城\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e巨蛋不是給人看的，是給人進去的。\u003c/p\u003e\u003cp\u003e我要把國際級場館、觀賽視野跟周邊交通做起來，然後去爭取世界棒球經典賽、大聯盟海外賽落腳新北。運動幣也可以拿來買賽事門票，讓市民真的走進場看球。說實在，孩子平常打球的地方是那 20 座運動中心，不會是巨蛋。但一座城市要有一個地方，讓孩子知道打得好，可以站上去。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e新北一直在培養球員，接下來也要給球員一座舞台。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e第三，全台第一座水陸共融運動園區\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e把八里東海運動休閒中心跟八里水上運動中心整合起來，水上運動、陸上運動一次到位。SUP、獨木舟、帆船，還有身障者、親子、銀髮族都進得來的共融運動館。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e山、海、河，新北本來就有，只是還沒串起來。場館我來蓋，習慣大家一起養。挺運動，讓新北動起來，讓世界看見新北！\u003c/p\u003e","image":"https://firebasestorage.googleapis.com/v0/b/portaly-ca9e1.appspot.com/o/Ywf2Uj00rhhzoMmK7HZL%2FpagesBlocks%2F0VESrD1GohgTIzdcIGBd%2FitemMap.yKfd5C46vlLC-Ty9gpk9Q.image?alt=media\u0026token=c2d33f18-4bca-491a-a306-bec4ddbcb9f2","itemId":"yKfd5C46vlLC-Ty9gpk9Q","linkId":"p6vOzX7gI5CO15l4yZst","originalIndex":0,"text":"了解更多"}],"type":"collection","updatedAt":{"_nanoseconds":519000000,"_seconds":1789375786}},"Lz2El7gdhFws6SuSWVvm":{"createdAt":{"_nanoseconds":423000000,"_seconds":1788326311},"hidden":false,"id":"Lz2El7gdhFws6SuSWVvm","initial":false,"items":[{"alt":"李四川運動平權政策","cta":true,"description":"\u003ch2 style=\"text-align:left\"\u003e\u003cstrong\u003e運動平權2.0\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e今天在金山中角灣，我自己也下去試了衝浪。\u003c/p\u003e\u003cp\u003e說實在，光是趴穩就不容易。但那個下午，我看最久的不是海。是輪椅怎麼走過那一段沙子。沙是軟的，輪子一壓就陷。要下到水邊那短短一段路，對很多人來說是走不過去的。勇氣他們自己有。缺的，是一條進得去的路。所以今天，我提出「運動平權 2.0」。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e一、國民運動中心設置身障運動專區\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e新北的國民運動中心，是這十幾年一座一座蓋起來的。硬體有了，下一步是把不同障別用得到的器材補齊、把無障礙動線做順、把專業指導配上。不是把人隔開，是把設備補到位。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e二、打造輪椅友善的運動環境\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e從入口、停車、通行動線、觀賽席位到器材設施，全面盤點改善。進得去、動得了、看得到比賽——這三件事，一件都不能少。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e三、打造無障礙親海環境\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e中角灣這一段沙灘，還有新北其他的海岸，設置無障礙木棧道，改善輪椅的通行動線，接上輪椅衝浪跟其他適應體育活動。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e海洋無障礙，運動零距離。\u003c/p\u003e\u003cp\u003e無障礙不是讓身障朋友「進得來」，是讓他們待得住。\u003c/p\u003e\u003cp\u003e我鋪了一輩子的路。這一條，要鋪到海邊。\u003c/p\u003e","image":"https://firebasestorage.googleapis.com/v0/b/portaly-ca9e1.appspot.com/o/Ywf2Uj00rhhzoMmK7HZL%2FpagesBlocks%2FLz2El7gdhFws6SuSWVvm%2FitemMap.wJH1brA2QxfbTurRcBbJ_.image?alt=media\u0026token=b8a04112-0592-4e33-a263-f55693769511","itemId":"wJH1brA2QxfbTurRcBbJ_","linkId":"Qe73JsgHIDPcqHQxNeSU","originalIndex":0,"text":"了解更多"}],"type":"collection","updatedAt":{"_nanoseconds":666000000,"_seconds":1788326697}},"M1jVof312fanSSBtyeUt":{"createdAt":{"_nanoseconds":685000000,"_seconds":1788323743},"id":"M1jVof312fanSSBtyeUt","items":[{"alt":"李四川客家政策","cta":"true","description":"\u003ch3\u003e\u003cstrong\u003e李四川挺客家\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e客家文化，不是逢年過節才想起的事\u003c/p\u003e\u003cp\u003e它就在新北的日常裡\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e說實在，在新北，客家文化在巷口的歌謠班裡、在哈客館的下課時間裡、在義民祭的人潮裡，這就是我們的「都會客家」。新北有67 萬客家鄉親，全台第二多，多元、包容，也最有活力。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e客家政策，我提出六大方向：\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e1.社團補助加碼，每班最高 10 萬，跟台北市齊平\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e2.哈客館繼續佈點，從第十一館朝「十二年十五館」走\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e3.持續提升客語教育師資環境，鼓勵客語教師投入傳承\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e4.義民祭辦更大、六大節分區辦，讓區區都有客家味\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e5.客家文化園區轉型，不只是博物館，更是來新北必走的景點\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e6.各局處建置客語無障礙環境，講客語在新北不卡關\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e這些年客家場館，侯友宜市長基礎打得穩，哈客館「八年十館」達標，已蓋到第十一館，接下來，工程專業的我會持續蓋到十五館。\u003c/p\u003e\u003cp\u003e這些館，是客家最好的基地——下一階段，我要讓客家文化走進生活，活在新北的每一條街上。\u003c/p\u003e","image":"https://firebasestorage.googleapis.com/v0/b/portaly-ca9e1.appspot.com/o/Ywf2Uj00rhhzoMmK7HZL%2FpagesBlocks%2FM1jVof312fanSSBtyeUt%2FitemMap.tga472DGQRTkimhDOn0SS.image?alt=media\u0026token=dc669f09-2411-4675-8b25-e5d13d82a0d9","itemId":"tga472DGQRTkimhDOn0SS","linkId":"eBsBwlMjwtSyuzMXnmuS","originalIndex":0,"text":"了解更多"}],"type":"collection","updatedAt":{"_nanoseconds":535000000,"_seconds":1788326671}},"Mhc0dFdX9qVleaIPgp77":{"createdAt":{"_nanoseconds":962000000,"_seconds":1790749529},"hidden":false,"id":"Mhc0dFdX9qVleaIPgp77","initial":false,"items":[{"alt":"李四川文化三策","cta":true,"description":"\u003ch2 style=\"text-align:left\"\u003e\u003cstrong\u003e李四川挺文化\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003e文化，是把地方的生命力帶向世界。說實在，文化不是只有大場館、大活動。是一群人在一個地方扎根幾十年，把地方的故事變成作品。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e新北的天主教育化民族舞蹈團，57年教了1000多個孩子跳舞， 很多是經濟弱勢家庭的孩子， 後來跳到國外，被叫做「台灣小花」。一個團隊能撐57年，靠的是有人買票、有舞台可以上、有地方可以練。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e所以我提出新北文化三策：\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e一、文化幣600元，讓市民走進文化 \u003c/strong\u003e\u003c/p\u003e\u003cp\u003e每年規劃15萬份，設籍新北、不限年齡，抽籤發放。 補助是政府給的，買票是市民給的。後面這個，團隊才走得久。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e二、新北國際藝術節，讓世界看見新北 \u003c/strong\u003e\u003c/p\u003e\u003cp\u003e把國際團隊請進來，也把新北的團隊送出去。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e三、創作免場租，讓人才留在新北 \u003c/strong\u003e\u003c/p\u003e\u003cp\u003e舞團缺的常常不是掌聲，是一間排練室。 盤點閒置或可活化的公有空間，讓在地團隊免費進駐。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e做工程的人都知道，地基打穩，上面的東西才站得起來。\u003c/p\u003e\u003cp\u003e我希望替新北的創作者，把這塊地基打好。\u003c/p\u003e","image":"https://firebasestorage.googleapis.com/v0/b/portaly-ca9e1.appspot.com/o/Ywf2Uj00rhhzoMmK7HZL%2FpagesBlocks%2FMhc0dFdX9qVleaIPgp77%2FitemMap.MN3t-Cljr9PnlJa2jV2ze.image?alt=media\u0026token=92088e19-3f4b-4871-8856-3b7c27da1cfb","itemId":"MN3t-Cljr9PnlJa2jV2ze","linkId":"Gyu9zVJ1FgYuNnFbmXTz","originalIndex":0,"text":"了解更多"}],"type":"collection","updatedAt":{"_nanoseconds":207000000,"_seconds":1790749624}},"O4j4LEwO64eNf25CUfSY":{"createdAt":{"_nanoseconds":973000000,"_seconds":1789375520},"hidden":false,"id":"O4j4LEwO64eNf25CUfSY","initial":false,"items":[{"alt":"李四川觀光政策","cta":true,"description":"\u003ch2 style=\"text-align:left\"\u003e\u003cstrong\u003e青春山海線2.0\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e一天之內，你可以在九份看山、在東北角吹風、在淡水河上看夜景。這三個地方，全部都在新北。但現在要這樣玩，你得自己開車、自己找路、自己想辦法把它們兜起來。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e侯友宜市長推動「青春山海線」這幾年，把新北的山海美景帶到很多人面前。人潮進來了，接下來要處理的，就是怎麼讓大家玩得更順、待得更久。玩得順不順，是工程問題。玩得開不開心，是新北 29 區自己的本事。前面那一半，我來做。後面那一半，讓 29 區自己發光。所以下一步，是「青春山海線 2.0」，把山、海、河、城市跟 29 區接成一整趟旅程。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e🚡 搭纜車上山城\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e瑞芳火車站旁邊興建「九份觀光纜車」，直達九份，不用塞車、不用找車位。「水金九舊坑道台車」也要讓它重新動起來，讓大家認識新北的礦業文化。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e🚲 騎單車到海邊\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e打造濱海自行車道，深澳到貢寮的專用道，往西一路串到八里、淡水。淡江大橋不是拿來經過的，是讓你專程去看夕陽的。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e⛵ 搭遊船賞美景\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e「河岸遊船觀光」要動起來，淡水河的船開航，忠孝碼頭接大稻埕碼頭。還要跟台北市一起辦河岸煙火節——淡水河兩岸一起放，這件事新北自己做不來，要雙北坐下來談。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e🚇 搭捷運遊山林\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e四環八線加上軌道建設 123，下了捷運就接得上步道，微笑山線、淡蘭古道，城市直接走進山林。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e🎫 周遊券玩山海\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e北北基好玩卡升級，把桃園拉進來，一張券玩遍北北基桃。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e新北 29 區，每一區都有自己的風景、自己的故事、自己的味道。不用出遠門，一趟就玩得到。路，我蓋了一輩子。接下來，換我帶大家去玩。\u003c/p\u003e","image":"https://firebasestorage.googleapis.com/v0/b/portaly-ca9e1.appspot.com/o/Ywf2Uj00rhhzoMmK7HZL%2FpagesBlocks%2FO4j4LEwO64eNf25CUfSY%2FitemMap.yrvxtvNTupLsrk-eN_Tu9.image?alt=media\u0026token=6ed0707b-fb99-4882-be6c-45e598bbff25","itemId":"yrvxtvNTupLsrk-eN_Tu9","linkId":"4yUpPF6vrHh7KATYAs2Y","originalIndex":0,"text":"了解更多"}],"type":"collection","updatedAt":{"_nanoseconds":198000000,"_seconds":1789375639}},"QPU6DfFoMMfJmhMwIiX2":{"createdAt":{"_nanoseconds":732000000,"_seconds":1788324125},"hidden":false,"id":"QPU6DfFoMMfJmhMwIiX2","initial":false,"items":[{"alt":"李四川原民政策","cta":true,"description":"\u003ch2 style=\"text-align:left\"\u003e\u003cstrong\u003e原力新北・共榮未來\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e我和族人朋友一起公布了我的原住民政策。\u003c/p\u003e\u003cp\u003e北原山貓一開唱，全場就熱起來了。遇到他們開玩笑，把〈沒什麼了不起〉現場改了詞，唱「李四川真的了不起」，說實在，被這樣的傳奇樂團虧一下，我反而很開心，因為這代表族人把我當自己人。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e既然是自己人，我就講真的，原住民族要的從來不是被照顧，是一座站得上去的舞台。我想起有一年在貢寮的海洋音樂祭，我代替朱立倫市長頒獎，在台下站了大概半天。等到念第一名，我才發現，從第一名到第十名，幾乎都是原住民的孩子。歌聲、創作，一個比一個厲害。我那時候就在想：比賽只有第一名能簽約，那剩下這九個一樣有才華的孩子，他們的舞台在哪裡？\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e所以今天我提出「原力新北・共榮未來」，四個原力一條一條來：\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e【安居原力】我會新建原住民自己的社會住宅，擴大租金補貼。在都市打拚，先有一個安穩的家。\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e【文化原力】原力廣場是侯市長開的頭，我接著把它做大，讓祭典、研習一年比一年豐富。文化有根，族人才站得穩。\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e【青年原力】成立青年團、設青創基地。年輕人要創業，政府幫你扶第一把。讓青年有夢，敢做夢。\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e【運動原力】我們原住民拿奧運獎牌的比例那麼高，天份不能被埋沒。國內賽事獎金，我提高到 18 萬，讓孩子從小就敢拚。\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e所以我講的四個原力，每一個都是一座舞台——讓族人安居、讓文化扎根、讓青年圓夢、讓選手發光。因為原民好，新北就好；原力強，新北更強。\u003c/p\u003e","image":"https://firebasestorage.googleapis.com/v0/b/portaly-ca9e1.appspot.com/o/Ywf2Uj00rhhzoMmK7HZL%2FpagesBlocks%2FQPU6DfFoMMfJmhMwIiX2%2FitemMap.z7tKkEPcLfdxtuDhwJHvo.image?alt=media\u0026token=c8e505e1-874c-4c25-958d-5c5690019d16","itemId":"z7tKkEPcLfdxtuDhwJHvo","linkId":"zGYnDJ2Nr3MBZTjJvvMR","originalIndex":0,"text":"了解更多"}],"type":"collection","updatedAt":{"_nanoseconds":396000000,"_seconds":1788326683}},"mzv1jBeVEt3nJHi818ME":{"createdAt":{"_nanoseconds":300000000,"_seconds":1788326506},"hidden":false,"id":"mzv1jBeVEt3nJHi818ME","initial":false,"items":[{"alt":"新北無菸害商圈","cta":true,"description":"\u003ch2 style=\"text-align:left\"\u003e\u003cstrong\u003e新北無菸害商圈\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e今天跟萬安市長一起，去看了中山捷運站旁邊的兩間吸菸室。那是一個小小的負壓空間，但裡面裝的，是一個城市對人的細膩。抽菸的朋友，有地方好好休息；不抽菸的市民、推嬰兒車的媽媽、剛下課的小朋友、來商圈散步的長輩，少了在騎樓間擦身而過的那口嗆味。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e萬安市長從去年的年貨大街、今年的燈節雙展區慢慢試起來，市民的肯定接近九成。我這陣子跑過 29 區，也聽到不少新北市民支持負壓吸菸室的主張，為雙北流動的市民朋友，都會有感。\u003c/p\u003e\u003cp\u003e說實在，這就是「共治才共好」的實際行動。我想，把這個對的方向帶回新北。我今天提出一個政見：打造「無菸害商圈」。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e1. 商圈為原點，逐步擴張\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e新北幅員更大，無菸害的主張也要因地制宜。我會先從人潮多、影響面更廣的商圈開始做起，包括板橋車站、林口商圈、新莊副都心、淡水老街，人多的商圈，我們一個一個來。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e2. 打造人性化的負壓吸菸室\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e我做工程做了一輩子，什麼是好用的設計，看得出來。過去針對負壓吸菸室，我跟台北市新工處的同仁也討論過細節，這套合作經驗，我想帶回新北。由政府帶頭，邀民間一起參與，把硬體做到位、把細節顧到家。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e3. 新北耶誕城成為第一個示範區\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e無菸害商圈的第一站，就放在年底的新北耶誕城。耶誕城是朱立倫市長與侯友宜市長過去留給新北最閃亮的一張招牌，每年都有幾百萬人擠進板橋市民廣場，那麼多孩子的眼睛在看燈，那麼多家庭推著嬰兒車，他們應該享有一口好空氣。我們就以這裡為起點，讓耶誕城變成新北第一個「無菸害商圈」示範區，把這張招牌擦得更亮。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e雙北就是一體，共治才共好。無菸害商圈——要走得到，也要呼吸得到。人潮，我們一起帶。 好空氣，我們一起顧。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e新北的這口好空氣——我來做。\u003c/p\u003e","image":"https://firebasestorage.googleapis.com/v0/b/portaly-ca9e1.appspot.com/o/Ywf2Uj00rhhzoMmK7HZL%2FpagesBlocks%2Fmzv1jBeVEt3nJHi818ME%2FitemMap.OKfOpvit_z4GkATo1lqaD.image?alt=media\u0026token=423ec5e4-e767-44fd-88f3-1f7fcd99aea0","itemId":"OKfOpvit_z4GkATo1lqaD","linkId":"JMEdPfIVYEOtkoHItCKk","originalIndex":0,"text":"了解更多"}],"type":"collection","updatedAt":{"_nanoseconds":130000000,"_seconds":1790749646}}},"id":"0eYt5Bj2dvMCmMpuQTT2","index":1,"schemaVersion":1,"slug":"culture","title":"觀光文化與族群","type":"collection","updatedAt":{"_nanoseconds":970000000,"_seconds":1788326495}},"3i7sJZ5OLfWUVBUzjXZJ":{"blockOrders":["ZAhnD8W9epn6WStMVc33","QyN48cpUcInorqL1OZsf"],"blocks":{"QyN48cpUcInorqL1OZsf":{"createdAt":{"_nanoseconds":588000000,"_seconds":1788764931},"hidden":false,"id":"QyN48cpUcInorqL1OZsf","initial":false,"items":[{"alt":"李四川毛孩政策","cta":true,"description":"\u003ch2 style=\"text-align:left\"\u003e\u003cstrong\u003e毛孩3政策\u003c/strong\u003e\u003c/h2\u003e\u003cp style=\"text-align:left\"\u003e新北是全台毛寶貝最多的城市，將近 36 萬隻犬貓。我常常在想——一座城市走得多前面，看的是牠怎麼對待這些生命。\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e上一次我提了六大動保政策，從寵物醫院、生命紀念館到食品管理，得到不少飼主和動保團體的肯定。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e今天，我再往前走一步，提三件事：\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e一、推動寵物可陪同洽公。\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e在不影響公共秩序和安全的前提下，逐步開放特定場域。很多人辦結婚登記，也想帶著貓咪、狗狗一起留個紀念——人生重要的時刻，讓牠陪在身邊。\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e二、每年辦一次新北寵物嘉年華。\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e認養、市集、免費健檢、才藝互動，讓毛孩真正走進城市的公共生活。\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e三、建立寵物友善城市指數。\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e每一區的寵物設施、友善店家、認養、醫療，一項一項盤出來。哪一區還不夠，一目了然，就從那裡開始補。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e我是做工程的。管一條路、一座橋，靠的不是感覺，是一張逐項檢查、改得動的表。毛寶貝友善，我想用同一套方法做。說實在，毛寶貝已經是我們的家人。愛牠，靠愛心。顧牠，靠制度。家人，也是這座城市的市民。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e硬的我繼續蓋，軟的我繼續顧。\u003c/p\u003e","image":"https://firebasestorage.googleapis.com/v0/b/portaly-ca9e1.appspot.com/o/Ywf2Uj00rhhzoMmK7HZL%2FpagesBlocks%2FQyN48cpUcInorqL1OZsf%2FitemMap.jYWjfX245sRwHDGhtzBKE.image?alt=media\u0026token=b96e3a70-76e3-47ac-9236-34bf47c634b9","itemId":"jYWjfX245sRwHDGhtzBKE","linkId":"XeFQ2TTfnGLfERy4LV08","originalIndex":0,"text":"了解更多"}],"type":"collection","updatedAt":{"_nanoseconds":625000000,"_seconds":1788765340}},"ZAhnD8W9epn6WStMVc33":{"createdAt":{"_nanoseconds":898000000,"_seconds":1788757310},"id":"ZAhnD8W9epn6WStMVc33","items":[{"alt":"李四川六大動保政策","cta":"true","description":"\u003ch2\u003e\u003cstrong\u003e六大動保政策\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003e現在很多家庭，毛寶貝就是家人。新北是全台灣毛寶貝最多的城市，光是登記在案的犬貓，就有將近 37 萬隻，全國第一，這代表照顧牠們，早就不是少數人的事，是很多家庭每天的生活。我一直認為，看一座城市進不進步，不只是看高樓蓋得多高，而是看對生命有沒有尊重。所以動物政策不能只停在「捕捉、收容、管理」。我想，下一步要做的是「治理」——從救援、醫療、生命教育到智慧管理，做成一套完整的制度。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e這次我提出六個方向，說白話就是：\u003c/p\u003e\u003cp\u003e① 蓋一間市立動保醫院。\u003c/p\u003e\u003cp\u003e認養回家的毛寶貝，基本照護免費，想養的人，不會再被醫療費嚇退。\u003c/p\u003e\u003cp\u003e② 設公有的生命紀念園區。\u003c/p\u003e\u003cp\u003e陪我們走過一程的牠，要走得有尊嚴，家人也付得起。\u003c/p\u003e\u003cp\u003e③ 成立野生動物救傷中心。\u003c/p\u003e\u003cp\u003e新北有山、有海、有河，受傷的野生動物，不能再只是臨時處理。\u003c/p\u003e\u003cp\u003e④ 把八座動物之家升級。\u003c/p\u003e\u003cp\u003e不只是收容，還要有醫療、長照、行為訓練，讓更多毛寶貝回得了家。\u003c/p\u003e\u003cp\u003e⑤ 把毛寶貝產業管好。\u003c/p\u003e\u003cp\u003e寵物食品該抽驗就抽驗，市民買得安心，毛寶貝用得放心。\u003c/p\u003e\u003cp\u003e⑥ 建一個智慧治理平台。\u003c/p\u003e\u003cp\u003e救援、捕蜂捉蛇、稽查、認養，整合成一張看得到的地圖。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e過去侯友宜市長做得很好，讓新北每年認養超過 3,000 隻、認養率 95%，也證明市民其實很有愛心。我們要做的，就是透過科技與制度，接著做得更好。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e照顧毛寶貝，其實也是在照顧市民。\u003c/p\u003e\u003cp\u003e城市的高度，就看怎麼對待生命。\u003c/p\u003e\u003cp\u003e讓這份愛，被支持、被接住。\u003c/p\u003e","image":"https://firebasestorage.googleapis.com/v0/b/portaly-ca9e1.appspot.com/o/Ywf2Uj00rhhzoMmK7HZL%2FpagesBlocks%2FZAhnD8W9epn6WStMVc33%2FitemMap.fMScPsVc9QPFqi27z99UA.image?alt=media\u0026token=a3bc69f7-2677-4d31-bf57-cda941f0931b","itemId":"fMScPsVc9QPFqi27z99UA","linkId":"5OpFNTnTWrpjYDAPpI81","text":"了解更多"}],"type":"collection","updatedAt":{"_nanoseconds":984000000,"_seconds":1788764865}}},"id":"3i7sJZ5OLfWUVBUzjXZJ","index":6,"schemaVersion":1,"slug":"Sustainability","title":"環境永續與動物保護","type":"collection"},"B3MvCaiCDpiqmFBM7UJi":{"blockOrders":["KVV44kXKdrtMeFn4HnWe","Bzg0VWDsKGcyZXRqf4SX","cmP5NemZqH9FlbaWCscp","P3LO5Ygwdu5mTd0fcGW8","IbF6ZU8oBX5r4i2yzjF5","C3kDmASfyKKYQJi8G0gh"],"blocks":{"Bzg0VWDsKGcyZXRqf4SX":{"createdAt":{"_nanoseconds":532000000,"_seconds":1788753018},"id":"Bzg0VWDsKGcyZXRqf4SX","items":[{"alt":"李四川青年創業政策","cta":"true","description":"\u003ch2\u003e\u003cstrong\u003e第一桶金計畫\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003e年輕人不缺想法，缺的是第一桶金。說實在，我跟年輕人差的只有年紀。他們接下來二、三十年要走的路，我走過；有些苦，我痛過。所以今天我提出青年政策，「第一桶金計畫」，就是要讓有夢的青年順利跨出第一步。從輔導、融資到全程陪伴，一站到底。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e青年創業四大築夢計畫：\u003c/p\u003e\u003cp\u003e✨一、青創貸款最高從 200 萬提高到 500 萬\u003c/p\u003e\u003cp\u003e啟動資金一次備足。研發、拓點、撐過最難的第一年，錢要夠。\u003c/p\u003e\u003cp\u003e✨二、放寬申請資格，青年團隊也能申請\u003c/p\u003e\u003cp\u003e一群人的夢想，不能只看其中一個人。\u003c/p\u003e\u003cp\u003e負責人或團隊成員之一設籍新北、已成年，就可以提出申請。\u003c/p\u003e\u003cp\u003e✨三、強化信用保證，降低貸款門檻\u003c/p\u003e\u003cp\u003e以前看你手上有什麼，以後看你打算做什麼。\u003c/p\u003e\u003cp\u003e政府的信用保證與風險分攤，不再只看擔保品和財務報表，更看創業計畫、市場潛力、商業模式。\u003c/p\u003e\u003cp\u003e✨四、創業導師全程陪跑\u003c/p\u003e\u003cp\u003e不是撥完款就結束。創業課程、商業模式診斷、財務規劃、經營輔導，我們一路陪你走完。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e有些彎路，有些冤枉路，我走過。\u003c/p\u003e\u003cp\u003e我走過，你就不必再走一遍。\u003c/p\u003e","image":"https://firebasestorage.googleapis.com/v0/b/portaly-ca9e1.appspot.com/o/Ywf2Uj00rhhzoMmK7HZL%2FpagesBlocks%2FBzg0VWDsKGcyZXRqf4SX%2FitemMap.VydQCEUqR8vTRlbNEcVeF.image?alt=media\u0026token=269ed414-dd41-472e-88ab-8f9d94857b7e","itemId":"VydQCEUqR8vTRlbNEcVeF","linkId":"CMy327ZMUGLlqULDOw51","text":"了解更多"}],"type":"collection","updatedAt":{"_nanoseconds":883000000,"_seconds":1788753168}},"C3kDmASfyKKYQJi8G0gh":{"createdAt":{"_nanoseconds":958000000,"_seconds":1788753204},"hidden":false,"id":"C3kDmASfyKKYQJi8G0gh","initial":false,"items":[{"alt":"李四川公托政策","cta":true,"description":"\u003ch2 style=\"text-align:left\"\u003e\u003cstrong\u003e校校有公托\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003e「校校有公托」這件事，我想和萬安市長並肩前行。\u003c/p\u003e\u003cp\u003e3/9那一天，也是我擔任臺北市副市長的最後一天，我陪同萬安市長參觀了新北市的埔墘及莊敬兩所公共托育中心。蔣市長表示，臺北市今年也要開始開辦公辦民營的托育機構，要達到的校校有公托的目標。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e這也是我的心願。在少子化的臺灣，我們對所有願意生養孩子的年輕父母親，都應該心懷感激，也應該推動各項托育配套措施，回報他們。歐洲這幾年生育率穩定或回升的國家，無一例外，都是以提供大量平價優質的公托設施為主要的配套政策。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e我當初也有參與新北市在民國100年設立的第一所公托。經過朱立倫與侯友宜兩位市長的努力，目前新北市的公托總數已經達到130家，收托的幼兒人數占全台公辦民營托嬰中心收托數的近5成。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e低薪以及托育問題，絕對是年輕人不生不養的主要原因。從少子化及勞動人力兩方面來說，我們都應該提供足夠的公托機構，父母親都不應該因為為生養子女而被迫離開職場。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e目前學校的閒置教室並沒有被充分運用，很重要的一個原因是法規限制公托中心只能設在3樓以下。相較於設置在一般公寓大廈的私托，學校是一個完全單純的環境，公托設在任何一個樓層，不僅安全，而且也方便父母親接送。若是顧慮到接送公托的幼兒會影響學校原本的教學或活動作息，那麼為公托設置獨立出入口動線，或在專屬樓層增建一部外掛式電梯就好。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e我將從這樣的標準再全面清理、運用新北市的閒置教室，讓各級學校都能夠增設公托中心或是公立幼兒園。政府要減輕年輕人的負擔，父母親不應該在生養子女和職場之間強迫只能二選一，因此我一定接下朱立倫、侯友宜兩位市長的棒子，全力推動公共托育。\u003c/p\u003e","image":"https://firebasestorage.googleapis.com/v0/b/portaly-ca9e1.appspot.com/o/Ywf2Uj00rhhzoMmK7HZL%2FpagesBlocks%2FC3kDmASfyKKYQJi8G0gh%2FitemMap.5mMwRZqzzNVU-aTaKhoLP.image?alt=media\u0026token=66cd43fc-463e-48f6-905d-d7e13e53070a","itemId":"5mMwRZqzzNVU-aTaKhoLP","linkId":"deXOndJMX7a2cF3nkruP","originalIndex":0,"text":"了解更多"}],"type":"collection","updatedAt":{"_nanoseconds":352000000,"_seconds":1788753301}},"IbF6ZU8oBX5r4i2yzjF5":{"createdAt":{"_nanoseconds":755000000,"_seconds":1788753871},"hidden":false,"id":"IbF6ZU8oBX5r4i2yzjF5","initial":false,"items":[{"alt":"李四川好孕政策","cta":true,"description":"\u003ch2 style=\"text-align:left\"\u003e\u003cstrong\u003e好孕政策\u003c/strong\u003e\u003c/h2\u003e\u003cp style=\"text-align:left\"\u003e說實在，這次的「好孕政策」，是從一個很土的問題開始想的——一個家庭決定要生小孩，接下來要面對的不是一件事，是一長串的事。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e產檢要不要加做？高齡了誰幫我追蹤？凍了好幾年的卵，解凍要花多少錢？生完之後情緒掉下去，誰接得住？\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e所以，我提出四個「安心」。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e💖安心檢：產前遺傳性疾病篩檢加碼補助，最高 3000 元。\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e💖安心孕：妊娠糖尿病、妊娠高血壓、孕期憂鬱納入重點照護，有專人持續追蹤、必要時轉介。\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e💖安心生：解凍卵補助，從 3 萬提高到 6 萬。這項補助新北是全國第一個做的，我要把它加倍。\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e💖安心養：心理照護往前延伸到孕期，加碼 3 次免費心理諮商。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e很謝謝  陳菁徽 委員。她是婦產科醫師，也是不孕症權威，跟我們來回討論了很多次——政策不能只有辦公室想的，還要有診間裡看到的。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e我是做工程的人，我不會假裝我懂懷孕。但我懂一件事，一條路卡在哪一段最痛苦，補助就要補在那一段。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e橋蓋慢了可以趕。一個孕期，趕不回來。\u003c/p\u003e","image":"https://firebasestorage.googleapis.com/v0/b/portaly-ca9e1.appspot.com/o/Ywf2Uj00rhhzoMmK7HZL%2FpagesBlocks%2FIbF6ZU8oBX5r4i2yzjF5%2FitemMap.sghHeLsBgqebFpdksmEXU.image?alt=media\u0026token=610b8202-db2e-43ca-a711-0534e4567b24","itemId":"sghHeLsBgqebFpdksmEXU","linkId":"cOkmOFIx2jkObTGHL2Hy","originalIndex":0,"text":"了解更多"}],"type":"collection","updatedAt":{"_nanoseconds":539000000,"_seconds":1788754059}},"KVV44kXKdrtMeFn4HnWe":{"createdAt":{"_nanoseconds":580000000,"_seconds":1791795203},"hidden":false,"id":"KVV44kXKdrtMeFn4HnWe","initial":false,"items":[{"alt":"李四川 平權政策","cta":true,"description":"\u003ch2 style=\"text-align:left\"\u003e\u003cstrong\u003e性別友善新北\u003c/strong\u003e\u003c/h2\u003e\u003cp style=\"text-align:left\"\u003e\u003cstrong\u003e\u003c/strong\u003e\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e性別友善，要做在薪水單上、路燈上、設計圖上。照顧孩子，不能只是媽媽的責任。一座城市友不友善，也不能只從單一性別的角度去看。\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e性別平權，我提三件事：\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e\u003cstrong\u003e第一件，育嬰留停薪資補足 100%\u003c/strong\u003e\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e說實在，孩子剛出生那幾個月，很多家庭都在算同一筆帳。\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e請育嬰假，薪水剩八成。誰的薪水低，誰就留在家裡。\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e算到最後，留下來的常常是媽媽。年底如果有機會回到新北市政府，剩下的兩成，市府補上。誰留下來顧小孩，夫妻自己商量，不用看薪水單。\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e\u003cstrong\u003e第二件，運動環境更安全、更友善\u003c/strong\u003e\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e晚上去公園、河濱運動的人越來越多，夏天也一年比一年熱。\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e遮蔭、降溫、夜間照明、監視設備、安全動線，一項一項補上去。\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e燈亮一點，安全就多一分。\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e\u003cstrong\u003e第三件，成立府級性別平等辦公室\u003c/strong\u003e\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e朱立倫市長、侯友宜市長，把新北的性平基礎打得很穩。\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e下一步，交通、公園、場館、公共廁所，從設計圖就把每一種人放進去。\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e做了四十多年工程，我很清楚：圖上沒畫到的人，蓋好就不好用。\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e性別平等，我不太會講大道理。\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e薪水補滿，燈裝亮，圖畫對。\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e一件一件做。\u003c/p\u003e","image":"https://firebasestorage.googleapis.com/v0/b/portaly-ca9e1.appspot.com/o/Ywf2Uj00rhhzoMmK7HZL%2FpagesBlocks%2FKVV44kXKdrtMeFn4HnWe%2FitemMap.xxgTphVHwPVlYEa4kQuyK.image?alt=media\u0026token=99cb773c-2112-4e52-aa51-de5f2cecab22","itemId":"xxgTphVHwPVlYEa4kQuyK","linkId":"OfMN7IeLqz9JxPGRTCFU","originalIndex":0,"text":"了解更多"}],"type":"collection","updatedAt":{"_nanoseconds":169000000,"_seconds":1791795416}},"P3LO5Ygwdu5mTd0fcGW8":{"createdAt":{"_nanoseconds":129000000,"_seconds":1788753569},"hidden":false,"id":"P3LO5Ygwdu5mTd0fcGW8","initial":false,"items":[{"alt":"李四川親子政策","cta":true,"description":"\u003ch2 style=\"text-align:left\"\u003e\u003cstrong\u003e三大親子政策\u003c/strong\u003e\u003c/h2\u003e\u003cp style=\"text-align:left\"\u003e到板橋的孕婦裝觀光工廠，穿上孕婦體驗衣，還縫了一雙嬰兒鞋，年輕時拉電線的手，這次改穿針引線。說實在，體驗衣比縫紉更辛苦。才背這麼一下下，腰就痠了——媽媽們，是整整十個月。所以我一直講：我們一定要對媽媽好一點。政府不能只是嘴巴上鼓勵生育，要實際把爸媽的負擔接過來。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e當選後，我要推三大親子政策：\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e🚗 好孕專車延長到 1 歲 \u003c/p\u003e\u003cp style=\"text-align:left\"\u003e現在補助到產後 6 個月，我把它延長到孩子滿 1 歲，並擴大跟多元計程車合作。產檢、回診、打預防針，一路有車。\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e🧸 運動中心免費臨托 \u003c/p\u003e\u003cp style=\"text-align:left\"\u003e很多爸媽想運動、想喘口氣，最大的問題就是孩子沒人顧。我們在國民運動中心試辦親子臨托：每週三下午 2 點到晚上 9 點，2 到 12 歲，憑當日消費證明 2 小時免費。你在樓上流汗，孩子在樓下玩，同一棟，安心。\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e🏛 打造新北 BABY BOSS 成長館 \u003c/p\u003e\u003cp style=\"text-align:left\"\u003e興建室內大型親子館，共融遊具、感統探索、親子共學、職能體驗通通放進來。下雨天，孩子也有地方長大。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e好孕交通、免費臨托、親子空間，這三件事，我會像穿針引線一樣，一件一件串起來，織成一張網，接住每一個爸媽、每一個孩子。做工程的人知道，一座城市的地基，不是只有鋼筋水泥。\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e願意在這裡生孩子、養孩子的家庭，才是新北最重要的地基。\u003c/p\u003e","image":"https://firebasestorage.googleapis.com/v0/b/portaly-ca9e1.appspot.com/o/Ywf2Uj00rhhzoMmK7HZL%2FpagesBlocks%2FP3LO5Ygwdu5mTd0fcGW8%2FitemMap.ReoH5Ys6hb7hAB0o3dB6m.image?alt=media\u0026token=cdc1ffb9-9310-4953-aa2f-222552af481d","itemId":"ReoH5Ys6hb7hAB0o3dB6m","linkId":"4koauR8mD7B1Dqj2pxRp","originalIndex":0,"text":"了解更多"}],"type":"collection","updatedAt":{"_nanoseconds":873000000,"_seconds":1788753851}},"cmP5NemZqH9FlbaWCscp":{"createdAt":{"_nanoseconds":189000000,"_seconds":1788753318},"hidden":false,"id":"cmP5NemZqH9FlbaWCscp","initial":false,"items":[{"alt":"李四川教育政策","cta":true,"description":"\u003ch2 style=\"text-align:left\"\u003e\u003cstrong\u003e挺教育3大亮點\u003c/strong\u003e\u003c/h2\u003e\u003cp style=\"text-align:left\"\u003e說實在，我能有今天，是因為讀書的時候，有老師拉了我一把。我在岡山農工讀書，家裡沒有錢。那時候學校開課後輔導，老師們願意花時間，把我們這二、三十個想升學的孩子留下來上課。對一個小琉球來的窮孩子，那不是普通的課後輔導，那是一條翻身的路。\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e後來我考上台北工專。我一直記得那位教學組長。他讓我知道，一個孩子只要有人拉一把，人生真的會不一樣。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e而最常伸出那隻手的，就是老師。\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e那，誰來拉老師一把？\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e侯友宜市長這些年改善師生比、推動導師減課、建立教師支持制度，方向完全正確。我要站在這個基礎上，繼續做三件事：\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e✏️ 打造AI校園：\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e先讓AI進老師的備課桌，再讓AI陪孩子學習。讓AI是老師的助手，不是取代老師。\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e✏️ 推動班班25人：\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e115學年度國小每班降到28人，這是侯市長做到的。28到25，少的是人數，多的是每個孩子被看見。\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e✏️ 教師心理支持加碼：\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e老師也是人，也會累。提高免費心理諮商次數，把照顧老師的心，當成正式的市政工作。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e我在校園周圍蓋過天橋，也蓋了一輩子的橋和路。但我知道，一個城市真正的地基，是教育。五十年前，有一位老師做了我的貴人。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e現在，換我做老師的靠山。\u003c/p\u003e","image":"https://firebasestorage.googleapis.com/v0/b/portaly-ca9e1.appspot.com/o/Ywf2Uj00rhhzoMmK7HZL%2FpagesBlocks%2FcmP5NemZqH9FlbaWCscp%2FitemMap.BP4jtNMbDr1tAWw9dRT9w.image?alt=media\u0026token=88348c82-12ee-4ec8-bc1c-5e3dba8e66ba","itemId":"BP4jtNMbDr1tAWw9dRT9w","linkId":"yPXXG5DGguURfZ9v0lA8","originalIndex":0,"text":"了解更多"}],"type":"collection","updatedAt":{"_nanoseconds":105000000,"_seconds":1788753399}}},"id":"B3MvCaiCDpiqmFBM7UJi","index":4,"schemaVersion":1,"slug":"education","title":"青年婦幼與教育","type":"collection"},"CC7tjdjVehfTdqQ2AUdj":{"blockOrders":["ivH4XIhgghtyw56a0WcO","PtIZb3JIBt292iBCdfUg","d78t6Byy4HQpna5zmzBe","EkhtxSs5mbaS4syTjXYv","3KWo1pStSt4zpfAwrpSi"],"blocks":{"3KWo1pStSt4zpfAwrpSi":{"createdAt":{"_nanoseconds":285000000,"_seconds":1788752803},"hidden":false,"id":"3KWo1pStSt4zpfAwrpSi","initial":false,"items":[{"cta":true,"description":"\u003ch2 style=\"text-align:left\"\u003e\u003cstrong\u003e企業托育\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003e為了打造友善職場育兒環境，新北市勞工局每年與勞動部聯合提供補助，企業興建托兒設施，可獲最高500萬元補助；更新或改善托兒設施，每年也有最高50萬元的補助；新北市還首創補助聘用教保人員的人事費。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e我在回程的路上想，除了大企業之外，中小企業難道就不能設立這種員工托兒所嗎？如果鄰近的幾家公司願意共同設立員工托兒所，只要其中一家公司有閒置空間，或是大家共同出資租下適當的空間，不是會有更多家庭受惠嗎？\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e另一方面，我們可以用容積獎勵的方式，鼓勵開發公司在新建商辦大樓時，在開發計畫中就納入用做員工托育的空間，並對這些企業托兒所給予減免房屋稅等其他賦稅獎勵。整棟大樓各家公司的員工都能帶孩子上班，這大概是世界級的景觀了。我先前已經提出校校有公托的政見。是不是能夠鼓勵各型企業也普設員工托兒所，我選上市長後一定能想出辦法。\u003c/p\u003e","image":"https://firebasestorage.googleapis.com/v0/b/portaly-ca9e1.appspot.com/o/Ywf2Uj00rhhzoMmK7HZL%2FpagesBlocks%2F3KWo1pStSt4zpfAwrpSi%2FitemMap.ZRcM0MiZu4_F4A_Fbi3r7.image?alt=media\u0026token=694c3da7-b76b-40cc-a05c-89e52c02dd88","itemId":"ZRcM0MiZu4_F4A_Fbi3r7","linkId":"2wu61X37ikQf5rsL1d7w","originalIndex":0,"text":"了解更多"}],"type":"collection","updatedAt":{"_nanoseconds":501000000,"_seconds":1788752905}},"EkhtxSs5mbaS4syTjXYv":{"createdAt":{"_nanoseconds":306000000,"_seconds":1788752509},"hidden":false,"id":"EkhtxSs5mbaS4syTjXYv","initial":false,"items":[{"alt":"李四川勞工政策","cta":true,"description":"\u003ch2 style=\"text-align:left\"\u003e\u003cstrong\u003e挺勞工\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003e說實在，我不是從辦公室開始認識勞工的。我半工半讀做水電、做冷氣。電匠、室內配線、工業配線甲級、空調甲級——四張技術士執照，都是自己一張一張考的。後來進了市政府，但工地我一直沒離開。所以我大概知道，做工的人真正在怕什麼，不是怕辛苦。辛苦是本來就有的。是怕出事那一天，家裡沒有人接得住。是怕夏天站在柏油路上，太陽不會因為你辛苦就變涼。是怕為了顧家人請假的那幾年，回過頭來，已經回不去了。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e今天發布的勞工政策，就是把這些「怕」，一件一件拿掉。\u003c/p\u003e\u003cp\u003e📌 挺安全\u003c/p\u003e\u003cp\u003e職災慰問金 30 萬提高到 36 萬，雙北同一個標準；失能、住院同步提高。\u003c/p\u003e\u003cp\u003e高溫防護補助擴大——風扇衣、水冷衣，是穿在身上的降溫；水霧、遮陽棚，是撐在工地的遮蔭。\u003c/p\u003e\u003cp\u003e📌 挺未來\u003c/p\u003e\u003cp\u003e 30 到 45 歲想回職場的人，每月 5,000 元、最長 3 個月。不只給錢，職涯諮商、職業訓練、就業媒合一路陪。\u003c/p\u003e\u003cp\u003e新北 9 站 15 台 5 駐點，從市區到偏鄉都走得到。\u003c/p\u003e\u003cp\u003e📌 挺家庭 \u003c/p\u003e\u003cp\u003e企業設職場托育，市府給獎勵、減房屋稅。企業發育兒津貼，市府再補助企業，最高 6,000 元。你在上班，孩子就在隔壁。\u003c/p\u003e\u003cp\u003e📌 挺權益\u003c/p\u003e\u003cp\u003e工會租金、行政費、交流補助全部提高。AI 與數位技能課程開起來，不讓人被時代甩掉。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e這些不是打掉重來，是在前面累積的基礎上，往上再加一階。我這雙手扛過冷氣、鎖過螺絲、拿過鐵鎚。現在我想用這雙手，扛新北勞工朋友的事。做過工的人，才知道工人缺什麼。\u003c/p\u003e","image":"https://firebasestorage.googleapis.com/v0/b/portaly-ca9e1.appspot.com/o/Ywf2Uj00rhhzoMmK7HZL%2FpagesBlocks%2FEkhtxSs5mbaS4syTjXYv%2FitemMap.n4BKNYpbFIy7l7WwFWPnM.image?alt=media\u0026token=5d5e021f-eca0-4443-a7d9-1bcdcbbd711d","itemId":"n4BKNYpbFIy7l7WwFWPnM","linkId":"95oXxG2wYiyL0SxT6Lo2","originalIndex":0,"text":"了解更多"}],"type":"collection","updatedAt":{"_nanoseconds":914000000,"_seconds":1788752635}},"PtIZb3JIBt292iBCdfUg":{"createdAt":{"_nanoseconds":3000000,"_seconds":1788752197},"hidden":false,"id":"PtIZb3JIBt292iBCdfUg","initial":false,"items":[{"cta":true,"description":"\u003ch2 style=\"text-align:left\"\u003e\u003cstrong\u003e新北職人passport\u003c/strong\u003e\u003c/h2\u003e\u003cp style=\"text-align:left\"\u003e我一直尊敬每一個行業認真做事的人，我公布「新北職人 Passport」政策。 很多人不知道，我開過麵包店，我自己也烘烤過鳳梨酥跟鳳凰酥。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e今天到維格餅家，跟董事長、跟來校外教學的小朋友一起做鳳梨酥。有小朋友一眼認出我，喊「是川伯！」還拉著同學一起來打招呼。我幫旁邊的妹妹包餡、壓模，大家做出台灣、元寶、鳳梨的形狀，做得很開心。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e說實在，烘焙這一行不簡單。整個烤焙過程都在高溫裡，每一道工序都不能馬虎。以前我在麵包店做最多的工作是洗盤、洗攪拌桶——攪拌桶只要留一點油渣，蛋白放進去就打不發。成敗，常常就在你看不見的地方。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e一間觀光工廠，裝得下職人的手藝，也裝得下一家人的假日。\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e所以有了「新北職人 Passport」：\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e✅串聯 18 家觀光工廠跟產業文化館，一本護照就能入館體驗、集章換紀念品，18 館走完再送限量職人禮。\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e✅小朋友可以做職涯探索，長輩可以透過導覽跟手作課程走出家門、動手動腦，讓觀光工廠成為新北最有代表性的親子旅遊品牌。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e把每一個細節做到位，就是職人精神。做糕餅是這樣，把一個城市做好，也是這樣。\u003c/p\u003e","image":"https://firebasestorage.googleapis.com/v0/b/portaly-ca9e1.appspot.com/o/Ywf2Uj00rhhzoMmK7HZL%2FpagesBlocks%2FPtIZb3JIBt292iBCdfUg%2FitemMap.9U5I36LtAzmN5VimhlQWK.image?alt=media\u0026token=a58dc471-d4ec-4064-9930-8171b2901e5e","itemId":"9U5I36LtAzmN5VimhlQWK","linkId":"MKManvok0UyCg543taKl","originalIndex":0,"text":"了解更多"}],"type":"collection","updatedAt":{"_nanoseconds":314000000,"_seconds":1788752310}},"d78t6Byy4HQpna5zmzBe":{"createdAt":{"_nanoseconds":125000000,"_seconds":1788752338},"hidden":false,"id":"d78t6Byy4HQpna5zmzBe","initial":false,"items":[{"alt":"李四川產業四箭","cta":true,"description":"\u003ch2 style=\"text-align:left\"\u003e\u003cstrong\u003e產業四箭，打造AI之都\u003c/strong\u003e\u003c/h2\u003e\u003cp style=\"text-align:left\"\u003e在寶高智慧園區，一位進駐廠商的副總跟我說：「他們的工程師，凌晨兩點想到一個 idea，就直接開車進辦公室」我聽了很有感。AI 的競爭是全球的，但工程師的生活，是在一個城市裡過的。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e說實在，人才不是用口號留下來的。他要有地方做研發，公司要有地方擴產，下班要有捷運可以搭，凌晨兩點門要打得開。一個城市能不能留住人才，看它接不接得住凌晨兩點。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e所以我提出產業四箭：\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e🏹 第一箭，AI 科技廊帶。興建蘆社大橋，不只是一條橋，而是銜接北士科與新北產業聚落的整體交通規劃，串起台64、台65，讓研發、製造、應用、出口在新北一條龍。\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e🏹 第二箭，產業專區倍增。推動淡海二、三期與五股交流道周邊開發，產業專區只租不售，政府蓋標準廠房，讓企業進得來、留得住。\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e🏹 第三箭，無人機產業起飛。新北有超過50家無人機重點廠商，我們要做台灣無人機產業發展中心。\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e🏹 第四箭，AI 電競新經濟。成立第二間電競基地，同時拓展銀髮電競，讓年輕人的興趣，變成接軌世界的產業。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e我做工程整整40年，很清楚一件事：橋要一墩一墩蓋，產業鏈要一節一節接。蘆社大橋不只是一座橋，是新北下一個30年的起點。產業留在新北，人才留在新北，工作留在新北。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e新北的凌晨兩點，有人開車進辦公室。\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e新北的下一個30年，有人已經開始蓋。\u003c/p\u003e","image":"https://firebasestorage.googleapis.com/v0/b/portaly-ca9e1.appspot.com/o/Ywf2Uj00rhhzoMmK7HZL%2FpagesBlocks%2Fd78t6Byy4HQpna5zmzBe%2FitemMap.KcJKFb2ozFQ904o3ms_7Z.image?alt=media\u0026token=5dd7cc3e-1a8a-42e8-8ee8-07e0ddd70c17","itemId":"KcJKFb2ozFQ904o3ms_7Z","linkId":"2A2m9nBr1UwiJP5Ee2cv","originalIndex":0,"text":"了解更多"}],"type":"collection","updatedAt":{"_nanoseconds":344000000,"_seconds":1788752482}},"ivH4XIhgghtyw56a0WcO":{"createdAt":{"_nanoseconds":452000000,"_seconds":1788751791},"id":"ivH4XIhgghtyw56a0WcO","items":[{"alt":"李四川勞工政策","cta":"true","description":"\u003ch3\u003e\u003cstrong\u003e給清潔隊員的五個承諾\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003e風雨往城裡灌，他們往外走\u003c/p\u003e\u003cp\u003e照顧清潔隊的弟兄，就是守住我們的城市\u003c/p\u003e\u003cp\u003e今天我在環保局工會，跟弟兄們報告 5 件要做的事。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e其中兩件，數字我先講明白：\u003c/p\u003e\u003cp\u003e1️⃣ 夜點費：120 → 200\u003c/p\u003e\u003cp\u003e半夜出勤的辛苦，要對得起。\u003c/p\u003e\u003cp\u003e2️⃣ 早點費：新增 100\u003c/p\u003e\u003cp\u003e清晨出班，一樣有照顧。\u003c/p\u003e\u003cp\u003e3️⃣ 每年一次免費健檢\u003c/p\u003e\u003cp\u003e身體先顧好，才顧得了城市。\u003c/p\u003e\u003cp\u003e4️⃣ 編預算，汰換老舊垃圾車\u003c/p\u003e\u003cp\u003e老車換新車，弟兄開得安心。\u003c/p\u003e\u003cp\u003e5️⃣ 窄巷研擬定點收運\u003c/p\u003e\u003cp\u003e讓清運過程，盡量安全又方便。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e說實在，我做工務、治水這麼多年，最知道這群弟兄的份量，風雨來之前，他們已經先把該清的清好。城市的安穩，是這樣一點一點顧出來的。\u003c/p\u003e\u003cp\u003e這 5 件，不是選舉才開的支票。過去在台北，我就是這樣顧清潔隊的，編過預算、換過車。我做過，所以我知道怎麼做。照顧做事的人，台北我做過，新北我接著做。\u003c/p\u003e","image":"https://firebasestorage.googleapis.com/v0/b/portaly-ca9e1.appspot.com/o/Ywf2Uj00rhhzoMmK7HZL%2FpagesBlocks%2FivH4XIhgghtyw56a0WcO%2FitemMap.XhVez6txxlOH2tChTScFy.image?alt=media\u0026token=ae299e9b-dec7-4953-b83f-810a6a549326","itemId":"XhVez6txxlOH2tChTScFy","linkId":"j3ZGmNV3rVAhr7iOtTRL","text":"了解更多"}],"type":"collection","updatedAt":{"_nanoseconds":132000000,"_seconds":1788751983}}},"id":"CC7tjdjVehfTdqQ2AUdj","index":3,"schemaVersion":1,"slug":"economy","title":"產業經濟與勞工","type":"collection","updatedAt":{"_nanoseconds":820000000,"_seconds":1788751803}},"Evqa9gVYmIBQtm5TErmZ":{"blockOrders":["r1wudv55wZOLOtGoPsm2","1D2O3WjHoPsvq7g5d3nC","CfC4LWsOHhIZLpwrSfCp","0KniHPdNmdBcZfRVlmQ5","KMsew0QpYvJH7MVgknir","1mGPQSsHroLsFo9q4uAV","0k0hOBIvRkRa58puIlF1","89SBcPDByncM22EkTFoe"],"blocks":{"0KniHPdNmdBcZfRVlmQ5":{"createdAt":{"_nanoseconds":58000000,"_seconds":1788754917},"hidden":false,"id":"0KniHPdNmdBcZfRVlmQ5","initial":false,"items":[{"alt":"李四川敬老卡升級","cta":true,"description":"\u003ch2 style=\"text-align:left\"\u003e\u003cstrong\u003e敬老卡升級 2.0\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003e這陣子跑遍新北二十九區、參加長者共餐，跟長輩聊到敬老卡，尤其遇到偏遠地區長者，最常聽到一句話：「點數很多，但能用的地方，還可以更多。」\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e新北的敬老卡，今年 7 月起每月 600 點，能搭公車、能搭捷運、能跨市搭台鐵，這個基礎，朱立倫市長奠定、侯友宜市長深化。\u003c/p\u003e\u003cp\u003e現在新北已經邁入超高齡社會，65 歲以上的長輩超過 81 萬人，是全台灣高齡人口最多的城市。最多長輩的城市，敬老政策也要走在前面。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e下一階段，我們要打造一個長者宜居的城市，這本身就是一個大工程。對我們做工程的人來說，東西不是越多越好，是要用得到才算數。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e敬老卡升級 2.0\u003c/p\u003e\u003cp\u003e600 點完全保留，其中 300 點悠遊卡化。\u003c/p\u003e\u003cp\u003e🔹 就醫回診\u003c/p\u003e\u003cp\u003e就醫、拿藥的開銷，悠遊卡一起幫\u003c/p\u003e\u003cp\u003e🔹 長者後盾\u003c/p\u003e\u003cp\u003e長照耗材、生活必需，每月 300 塊一起扛\u003c/p\u003e\u003cp\u003e🔹 健康加分\u003c/p\u003e\u003cp\u003e保健食品、自費項目，健保不到的，一起補位\u003c/p\u003e\u003cp\u003e便利商店、超市、藥局、計程車、診所，悠遊卡能去的地方，敬老卡都能用。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e我做了 40 年的公務員，從三職等開始做起，我知道一件事——錢，要花在真正卡住的地方。長輩要的不只是更多點數，是要用的時候，真的用得到。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e新北要成為長者宜居的城市。\u003c/p\u003e\u003cp\u003e把外面的路鋪平、把心裡的路打通。\u003c/p\u003e\u003cp\u003e讓長輩願意走出來，每天都想出門看看。\u003c/p\u003e\u003cp\u003e鋪了一輩子的路，這次要鋪到長輩心裡。\u003c/p\u003e","image":"https://firebasestorage.googleapis.com/v0/b/portaly-ca9e1.appspot.com/o/Ywf2Uj00rhhzoMmK7HZL%2FpagesBlocks%2F0KniHPdNmdBcZfRVlmQ5%2FitemMap.9LFMMzWMiPef6thudXjKJ.image?alt=media\u0026token=74755852-04f9-4eb1-b5a7-25dd546a5c52","itemId":"9LFMMzWMiPef6thudXjKJ","linkId":"A4rBdAp3bKZhl0XObUEX","originalIndex":0,"text":"了解更多"}],"type":"collection","updatedAt":{"_nanoseconds":983000000,"_seconds":1788754996}},"0k0hOBIvRkRa58puIlF1":{"createdAt":{"_nanoseconds":640000000,"_seconds":1788756150},"hidden":false,"id":"0k0hOBIvRkRa58puIlF1","initial":false,"items":[{"cta":true,"description":"\u003ch2 style=\"text-align:left\"\u003e\u003cstrong\u003e新北醫療升級\u003c/strong\u003e\u003c/h2\u003e\u003cp style=\"text-align:left\"\u003e土城醫院，我從會勘、協調，到看著它一層一層蓋起來，整整跟了五年。所以我知道，一間醫院要從圖上走到地上，有多難。也知道，怎麼讓它走得快一點。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e今天我提出五大醫療政策——BOT 加速興建、分區補足量能：\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e一、興建蘆洲醫院，近 20 萬人的蘆洲，該有一間自己的大醫院。\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e二、加速板橋醫療園區，55 萬人的量能，要補上。\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e三、推動淡海新市鎮醫院，長輩的復健照護，就近解決。\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e四、強化土城醫療園區，超高齡社會，先準備好。\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e五、協助恩主公醫院擴建，溪南的醫療網，更完整。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e醫院不是蓋給地圖看的，是蓋給每一個半夜掛急診的家庭、每一個帶爸媽回診的兒女。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e路，我鋪到了 29 區。醫療，我要蓋進每一個生活圈。\u003c/p\u003e","image":"https://firebasestorage.googleapis.com/v0/b/portaly-ca9e1.appspot.com/o/Ywf2Uj00rhhzoMmK7HZL%2FpagesBlocks%2F0k0hOBIvRkRa58puIlF1%2FitemMap.T8EpCbHOBi64_Mx9GZzg9.image?alt=media\u0026token=e964a881-df46-4ebf-9035-582f4b13f374","itemId":"T8EpCbHOBi64_Mx9GZzg9","linkId":"mcrMOMExSEr33pDxQ8AB","originalIndex":0,"text":"了解更多"}],"type":"collection","updatedAt":{"_nanoseconds":966000000,"_seconds":1788756726}},"1D2O3WjHoPsvq7g5d3nC":{"createdAt":{"_nanoseconds":74000000,"_seconds":1788754233},"id":"1D2O3WjHoPsvq7g5d3nC","items":[{"alt":"李四川老舊電梯政策","cta":"true","description":"\u003ch2\u003e\u003cstrong\u003e讓長輩能夠出門走走\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003e你的阿公、阿嬤如果住在沒有電梯的老舊公寓裡，你一定會了解我的感受。生病的老人家，只能隔著窗戶往外看，很難走出家門。就算孩子們有心，就算有外勞看護協助，揹著長輩上下樓梯出門走走或是去看病，彼此都辛苦。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e新北市屋齡超過30年的老屋有100萬戶左右。我看過一篇報導，以過去幾年都更報拆的平均數量，要1000年才能完成新北市的老屋都更。我是個務實的人，我覺得在加速推動都更以外，另一個重點應該是為老舊公寓裝設電梯。老舊公寓裝電梯的最大阻力是一樓。電梯落椿在一樓是整合的最大困難，因為一樓完全不需要使用電梯，而且電梯落椿的地點往往是一樓的停車位或是庭院，因此必須優先解決一樓的停車問題。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e市府不能從做功德的角度去要求一樓配合施做電梯，必須要能解決一樓的停車問題，才能提高一樓的配合意願。以下是我們未來會考慮採取的作法。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e一、免費提供住家附近公有或私有停車場的專屬車位給一樓屋主，私有停車場部分由市府出面洽談優惠停車費；\u003c/p\u003e\u003cp\u003e二、由交通局在附近的道路畫設一個專屬使用的停車位給一樓屋主；\u003c/p\u003e\u003cp\u003e三、由市府補助停車津貼給屋主。 \u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e有人會質疑我這樣的作法涉及圖利。社會住宅政策不就是為了圖利年輕人嗎？租金補貼政策不就是為了圖利弱勢的租屋族嗎？我想要的就是讓行動不便的老人家能夠方便進出自己的家。我圖利的是他們，我是為民興利。如何解決老舊公寓裝設電梯的其他問題，未來我還會陸續提出我的想法。\u003c/p\u003e","image":"https://firebasestorage.googleapis.com/v0/b/portaly-ca9e1.appspot.com/o/Ywf2Uj00rhhzoMmK7HZL%2FpagesBlocks%2F1D2O3WjHoPsvq7g5d3nC%2FitemMap.TTqOwK769DmI2EKjBNsck.image?alt=media\u0026token=cd3c5b22-d274-46df-985f-bacd93b4cc84","itemId":"TTqOwK769DmI2EKjBNsck","linkId":"168Qurfuq1505PvxAukq","text":"了解更多"}],"type":"collection","updatedAt":{"_nanoseconds":538000000,"_seconds":1788754456}},"1mGPQSsHroLsFo9q4uAV":{"createdAt":{"_nanoseconds":551000000,"_seconds":1788755997},"hidden":false,"id":"1mGPQSsHroLsFo9q4uAV","initial":false,"items":[{"alt":"李四川銀髮電競政策","cta":true,"description":"\u003ch2 style=\"text-align:left\"\u003e\u003cstrong\u003e銀髮電競政策\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003e「我阿嬤都比你強」——這句電競圈的玩笑，今天我在三重，信了。我輸給一群阿公阿嬤。他們手速快，戰術清晰。\u003c/p\u003e\u003cp\u003e對他們來說，這不只是玩，是走出家門、是動腦、是跟孫子終於有更多話聊。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e今天，我明確宣布兩件事：\u003c/p\u003e\u003cp\u003e🎮 推動「銀髮電競升級計畫」\u003c/p\u003e\u003cp\u003e擴大青銀電競課程，讓更多長輩走出家門、接觸電競、訓練反應力。\u003c/p\u003e\u003cp\u003e🚇 爭取第二座新北電競基地\u003c/p\u003e\u003cp\u003e選在捷運站周邊，讓電競資源從三重，延伸到新北更多地方。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e新北的電競基地，是全國第一個。從 朱立倫 前市長任內設立，到 侯友宜 市長這幾年把賽事、把產業總會一個一個做起來。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e下一階段，我要推廣給每一個世代——讓更多家長放心，這不是不務正業，是一條正路，一個專業。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e電競不分年齡，也不該被看輕。\u003c/p\u003e\u003cp\u003e該為他們爭取的，我來爭取。\u003c/p\u003e","image":"https://firebasestorage.googleapis.com/v0/b/portaly-ca9e1.appspot.com/o/Ywf2Uj00rhhzoMmK7HZL%2FpagesBlocks%2F1mGPQSsHroLsFo9q4uAV%2FitemMap.LdwNNuzQk27yN-tmp9kJL.image?alt=media\u0026token=6e89ce6c-9d33-4028-8887-da7d0ea91ea9","itemId":"LdwNNuzQk27yN-tmp9kJL","linkId":"qCUvdDUNYH3n6diGwgt3","originalIndex":0,"text":"了解更多"}],"type":"collection","updatedAt":{"_nanoseconds":974000000,"_seconds":1788756135}},"89SBcPDByncM22EkTFoe":{"createdAt":{"_nanoseconds":821000000,"_seconds":1788757102},"hidden":false,"id":"89SBcPDByncM22EkTFoe","initial":false,"items":[{"alt":"李四川護牙政策","cta":true,"description":"\u003ch2 style=\"text-align:left\"\u003e\u003cstrong\u003e全齡護牙\u003c/strong\u003e\u003c/h2\u003e\u003cp style=\"text-align:left\"\u003e做工程四十年，我學會一件事：地基沒顧好，上面蓋再漂亮都沒用。牙齒，就是身體的地基。孩子牙不好，影響發育；媽媽牙不好，育兒再忙也只能忍；長輩缺了牙，一碗飯吃不完，營養跟著掉，身體就跟著垮。所以今天，我跟新北市牙醫師公會的高君華理事長、葉建陽名譽理事長一起，提出五大護牙政策。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e侯友宜市長打下的基礎，我接棒，再往前一步：\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e📌 塗氟延伸到小一：孩子進校園第一年，口腔保健就跟上。\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e📌 國中窩溝封填擴及第二大臼齒：守到恆齒長齊為止。\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e📌 孕婦產後一年免費口腔保健：照顧孩子的人，也要有人照顧。\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e📌 弱勢長者及55歲以上原住民，假牙補助最高5萬元：缺牙補起來，飯才吃得下。\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e📌 重度失能失智：每年3000元口腔照護牙醫走進家裡、走進機構\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e從小一的第一次塗氟，到阿嬤的一口假牙，這是一套從小顧到老的口腔照護體系。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e預防勝於治療。蓋房子是這樣，顧身體也是這樣。牙齒顧得好，身體更健康——這件事，從「個人負擔」走向「城市照顧」，新北一起扛。\u003c/p\u003e","image":"https://firebasestorage.googleapis.com/v0/b/portaly-ca9e1.appspot.com/o/Ywf2Uj00rhhzoMmK7HZL%2FpagesBlocks%2F89SBcPDByncM22EkTFoe%2FitemMap.S2vPiuayvR6QcJ0W-EH7t.image?alt=media\u0026token=c0f03627-6414-469f-bc81-4c39fe6a885b","itemId":"S2vPiuayvR6QcJ0W-EH7t","linkId":"7r9sc54DE2VuCU3OO4jU","originalIndex":0,"text":"了解更多"}],"type":"collection","updatedAt":{"_nanoseconds":641000000,"_seconds":1788757173}},"CfC4LWsOHhIZLpwrSfCp":{"createdAt":{"_nanoseconds":687000000,"_seconds":1788754463},"hidden":false,"id":"CfC4LWsOHhIZLpwrSfCp","initial":false,"items":[{"alt":"李四川老舊電梯政策2","cta":true,"description":"\u003ch2 style=\"text-align:left\"\u003e\u003cstrong\u003e老舊公寓裝設電梯\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003e雙北市過去幾年都在推動老舊公寓裝設電梯，但是成案數不多。這並不表示沒有這個需求，事實上我們知道需求非常龐大。我先前已經提出如何解決一樓不願配合裝設電梯的一些想法，今天來談談其他幾個問題。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e比一樓更棘手的是法令的問題。增建電梯必須取得建築法中所規定的「雜項執照」。如果電梯落椿的位置是屬於社區的公共空間，依照一個名稱落落長的法規—「建築物於共有土地增設昇降機應檢附土地及建築物權利證明文件作業規定」，申請雜項執照必須取得過半數土地與建築物所有權人的土地使用同意書。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e30年以上的老舊公寓，如果是獨棟的透天厝，問題可能單純一點；如果是雙併或是大型連棟式的社區，經過多年來的買賣、繼承、租賃，要找到過半數土地和建築物所有權人取得土地使用同意書，你只能等到地老天荒。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e徒法不足以自行。我呼籲中央盡快修改相關法規，將老舊公寓裝設電梯視為無障礙設施，以許可制取代目前必須取得過半數土地與建築物所有權人同意的規定。對於那些被一樓佔用的公共空間，政府應該強制拆除違建，為公共使用的電梯找出空間。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e目前中央和地方政府都對老舊公寓裝設電梯提出高額的補助辦法，但是相關法令不鬆綁，這些補助都只是畫餅。如果我當選新北市長，這會列為我向立委請托修法的優先待辦事項。\u003c/p\u003e","image":"https://firebasestorage.googleapis.com/v0/b/portaly-ca9e1.appspot.com/o/Ywf2Uj00rhhzoMmK7HZL%2FpagesBlocks%2FCfC4LWsOHhIZLpwrSfCp%2FitemMap.wusEOgfZXGY_HtZl59gsV.image?alt=media\u0026token=9e7b6375-a2ab-4a14-9fec-aa52738873b0","itemId":"wusEOgfZXGY_HtZl59gsV","linkId":"2u7Agbvi7taa0mZQneDM","originalIndex":0,"text":"了解更多"}],"type":"collection","updatedAt":{"_nanoseconds":995000000,"_seconds":1788754552}},"KMsew0QpYvJH7MVgknir":{"createdAt":{"_nanoseconds":829000000,"_seconds":1788755648},"hidden":false,"id":"KMsew0QpYvJH7MVgknir","initial":false,"items":[{"alt":"李四川敬老卡升級2","cta":true,"description":"\u003ch2 style=\"text-align:left\"\u003e\u003cstrong\u003e敬老卡悠遊卡化\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003e會喊的政策很多，會兌現的不多。\u003c/p\u003e\u003cp\u003e敬老卡升級，我跟侯友宜市長一直有共識，今天侯友宜市長宣布要落實了。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e📍今年 7 月起，每月點數提高至 600 點，還能騎 YouBike 電輔車\u003c/p\u003e\u003cp\u003e📍2027 年上半年，健檢、溫泉、觀光巴士、復康巴士陸續上路\u003c/p\u003e\u003cp\u003e📍2027 年下半年，300 點能用在農會、藥局、超商\u003c/p\u003e\u003cp\u003e📍2029 年，二代卡換發完畢、實施點數累積制度\u003c/p\u003e\u003cp\u003e一步一步，照時程走。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e今年我提的「敬老卡悠遊卡化」，就是讓 600 點裡的 300 點，能用在長輩日常真正需要的地方——看病、拿藥、買生活用品。今天新北市政府宣布往這個方向走，我要謝謝侯友宜市長的肯定。侯友宜市長率先把農會、藥局、超商這一步開出來；剩下的我接著做，讓敬老卡更貼近每一位長輩的需求。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e照顧長輩的福利提升，朱立倫市長奠定 、侯友宜市長深化，能夠一棒接一棒，是因為我們有共同的理念。照顧長輩，最實在的不是又一個承諾，是真的用得上的那一天。屬於長輩的卡，比的不是誰喊得多，是真的幫得上忙。\u003c/p\u003e","image":"https://firebasestorage.googleapis.com/v0/b/portaly-ca9e1.appspot.com/o/Ywf2Uj00rhhzoMmK7HZL%2FpagesBlocks%2FKMsew0QpYvJH7MVgknir%2FitemMap.takCAGkn9ejMzLEP5xmID.image?alt=media\u0026token=7ee964a8-9359-4d85-a7a2-b513eb3be646","itemId":"takCAGkn9ejMzLEP5xmID","linkId":"Zwn1dYCzq8ieK0mibfKM","originalIndex":0,"text":"了解更多"}],"type":"collection","updatedAt":{"_nanoseconds":424000000,"_seconds":1788755790}},"r1wudv55wZOLOtGoPsm2":{"createdAt":{"_nanoseconds":26000000,"_seconds":1791796121},"hidden":false,"id":"r1wudv55wZOLOtGoPsm2","initial":false,"items":[{"alt":"李四川 高齡政策","cta":true,"description":"\u003ch2 style=\"text-align:left\"\u003e\u003cstrong\u003e李四川 高齡政策\u003c/strong\u003e\u003c/h2\u003e\u003cp style=\"text-align:left\"\u003e新北超過 80 萬位長輩，每五位市民就有一位。超高齡社會不是要來了，是已經來了。\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e我提出「安心生活三大行動」：\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e\u003cstrong\u003e1. 把家顧好：高齡安心六大檢查\u003c/strong\u003e\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e做工程的人看房子，先看電線、瓦斯、扶手。\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e專人到宅，用電、防火、防災、防跌、無障礙、急難，一次看完。65 歲以上都能申請，75 歲以上獨居、失智失能的長輩，不用等你來，政府主動上門。該換的電線、該換的瓦斯爐，每戶最高補助 3 萬元。\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e\u003cstrong\u003e2. 把照顧提前：主動發掘高齡風險\u003c/strong\u003e\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e照顧不能等跌倒了才開始。\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e用 AI 結合訪視、送餐跟第一線服務，哪位長輩開始衰弱，早一步發現、早一步照顧。以前是長輩來找政府，以後換政府去找長輩。\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e\u003cstrong\u003e3. 把舞台留著：新北銀髮人才中心\u003c/strong\u003e\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e很多長輩退休了，體力還在、專業還在。\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e成立新北銀髮人才中心，彈性工時、專案工作、志願服務，想做的找得到機會。退休不是退場。\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e過去侯友宜市長把長照跟醫療的底打好了，接下來，要走進長輩家裡。做了 40 年工程，我知道一間房子安不安全，不是看外觀，是看細節。\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e長輩的生活也一樣，看的是細節。\u003c/p\u003e\u003cp style=\"text-align:left\"\u003e活得久不夠，要活得安心。\u003c/p\u003e","image":"https://firebasestorage.googleapis.com/v0/b/portaly-ca9e1.appspot.com/o/Ywf2Uj00rhhzoMmK7HZL%2FpagesBlocks%2Fr1wudv55wZOLOtGoPsm2%2FitemMap.ZcRdc7JcT2_XhBbiKAeVy.image?alt=media\u0026token=07c34724-9e65-4190-8a12-ff1407533f56","itemId":"ZcRdc7JcT2_XhBbiKAeVy","linkId":"IRpbw3qdX2mBalpi1qWH","originalIndex":0,"text":"了解更多"}],"type":"collection","updatedAt":{"_nanoseconds":198000000,"_seconds":1791796207}}},"id":"Evqa9gVYmIBQtm5TErmZ","index":5,"schemaVersion":1,"slug":"healthcare","title":"銀髮與醫療照護","type":"collection","updatedAt":{"_nanoseconds":931000000,"_seconds":1788754239}},"RdkKGPwuvh6Jr5RoqFYR":{"blockOrders":["o15A2J4VA2eJN95b9iAQh"],"blocks":{"o15A2J4VA2eJN95b9iAQh":{"hidden":"","id":"o15A2J4VA2eJN95b9iAQh","items":[{"cta":false,"description":"\u003ch2\u003e\u003cstrong\u003e我是李四川，做事的人\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e經歷：\u003c/p\u003e\u003cp\u003e臺北市政府副市長\u003c/p\u003e\u003cp\u003e高雄市政府副市長\u003c/p\u003e\u003cp\u003e新北市政府副市長\u003c/p\u003e\u003cp\u003e中國國民黨秘書長\u003c/p\u003e\u003cp\u003e行政院秘書長\u003c/p\u003e\u003cp\u003e臺北縣政府副縣長\u003c/p\u003e\u003cp\u003e臺北縣政府工務局局長\u003c/p\u003e\u003cp\u003e臺北市政府衛工處處長\u003c/p\u003e\u003cp\u003e臺北市政府新工處處長\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e學歷：\u003c/p\u003e\u003cp\u003e國立臺北科技大學電機工程研究所碩士\u003c/p\u003e\u003cp\u003e臺灣省立臺北工業專科學校電機科\u003c/p\u003e\u003cp\u003e臺灣省立岡山高級農工職業學校電工科\u003c/p\u003e\u003cp\u003e屏東縣立琉球國民中學\u003c/p\u003e","image":"https://firebasestorage.googleapis.com/v0/b/portaly-ca9e1.appspot.com/o/Ywf2Uj00rhhzoMmK7HZL%2FpagesBlocks%2Fo15A2J4VA2eJN95b9iAQh%2FitemMap.bQRiYQakrfM0PXbiFAIiu.image?alt=media\u0026token=1c6e23aa-eed5-4803-9852-5fa7973f6c13","itemId":"bQRiYQakrfM0PXbiFAIiu","text":"查看我的作品集"}],"type":"collection","updatedAt":{"_nanoseconds":529000000,"_seconds":1789448373}}},"id":"RdkKGPwuvh6Jr5RoqFYR","index":0,"schemaVersion":1,"slug":"about","title":"關於","type":"collection"},"S1L5BLCBf5jZQo3YPt5R":{"blockOrders":["Qevepcb4cOCfhHHpeqG5","NdZNzOI7KtuhUlHZj6jm","WxnuRk1bzHMudDwCUNwo","ROjMvkc4nQ6lfjOl4m4M"],"blocks":{"NdZNzOI7KtuhUlHZj6jm":{"createdAt":{"_nanoseconds":746000000,"_seconds":1788327054},"hidden":false,"id":"NdZNzOI7KtuhUlHZj6jm","initial":false,"items":[{"alt":"李四川軌道建設","cta":true,"description":"\u003ch2 style=\"text-align:left\"\u003e\u003cstrong\u003e軌道建設123\u003c/strong\u003e\u003c/h2\u003e\u003ch2 style=\"text-align:left\"\u003e\u003c/h2\u003e\u003cp\u003e「軌道建設123」，大家先看到的是三個數字： 一加速、兩快線、三連通。加起來，是30分鐘。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e一加速，是汐東線接東環段\u003c/strong\u003e——汐止、汐科進台北的那個瓶頸，先打通。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e兩快線，是淡北快線跟大漢溪捷運縱貫線。\u003c/strong\u003e一條往北接北士科、淡海；一條往西串三重、新莊、塭仔圳、土城。長距離的線要能跑快車，市民才願意把機車留在家裡。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e三連通，是蘆社大橋接北士科、中和光復線南北延伸、深坑輕軌延伸石碇。\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e內行的朋友一看就知道，這三件事其實在講同一件事——把雙北捷運斷掉的地方，接起來。不是台北的線多延一站，也不是新北的線多蓋一段。是把兩邊斷鍊的地方縫回去，讓人在站內就轉得了車，不必出站、不必再等下一班公車。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e我常講，離開台北市不是放棄台北市，是為了兩岸共治。這個兩岸，不是台灣海峽，是淡水河兩岸。三環三線，朱立倫市長奠基；四環八線，侯友宜市長深化。基礎很扎實了，我一路都在現場。下一步，我會把它們連成一張網。我記得，三環三線剛提出來的時候，很多人不相信蓋得成，民進黨還編了一句「三環三線，夢裡相見」來笑。現在，環狀線在跑、機場線在跑、淡海輕軌在跑。\u003c/p\u003e\u003cp\u003e笑話會過期，捷運不會。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e新北捷運公司第一任董事長、也做過交通部長的陳建宇跟我說，他小時候唱的是「123到台灣，台灣有個阿里山」，現在他想改一句：「123到新北，新北有個李四川。」我聽了不好意思。我只想說一句——省下來的30分鐘，不是給捷運的，是給家人的。該做的，我接著做。\u003c/p\u003e","image":"https://firebasestorage.googleapis.com/v0/b/portaly-ca9e1.appspot.com/o/Ywf2Uj00rhhzoMmK7HZL%2FpagesBlocks%2FNdZNzOI7KtuhUlHZj6jm%2FitemMap.T6CghUjqJT2syBflRegBv.image?alt=media\u0026token=eee32ffd-abff-4d98-b831-5b980e5da370","itemId":"T6CghUjqJT2syBflRegBv","linkId":"RGDy9MpRrPMivyL1mZVK","originalIndex":0,"text":"了解更多"}],"type":"collection","updatedAt":{"_nanoseconds":470000000,"_seconds":1788327286}},"Qevepcb4cOCfhHHpeqG5":{"createdAt":{"_nanoseconds":895000000,"_seconds":1788326879},"id":"Qevepcb4cOCfhHHpeqG5","items":[{"alt":"新北巨蛋城","cta":"true","description":"\u003ch2\u003e\u003cstrong\u003e南有巨蛋城，北有科學城\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e一座城市要往前走，先要看骨架撐不撐得住。\u003c/p\u003e\u003cp\u003e侯友宜市長任內從捷運路網、第二行政中心、新北美術館，到剛宣布的新北巨蛋城，已經把底子打得很好。我要做的，除了把好的建設延續下去，還要在這個基礎上，讓新北跨進下一個世代。\u003c/p\u003e\u003cp\u003e所以今天提出「南有巨蛋城、北有科學城」。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e南邊，以新北巨蛋城為核心，帶動樹林、土城、新莊、塭仔圳、三峽、鶯歌，做成溪南的新都心。\u003c/p\u003e\u003cp\u003e北邊，以淡海科學城串聯北士科、台北雙子星、台北港，做一條國際級的科技走廊。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e要撐住這兩個引擎，交通必須先到位。三件事：\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e一、分階段推動樹林鐵路地下化，並延伸到鶯歌。\u003c/strong\u003e鐵路下去，前後站接起來，樹林車站立體化成為巨蛋城的新門戶。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e二、延伸民生汐止線，推動大漢溪捷運縱貫線。\u003c/strong\u003e從大稻埕出發，串聯三重、新北第二行政中心、新莊、塭仔圳、樹林巨蛋城、土城產業園區，未來可以再往桃園、基隆延伸。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e三、推動淡北快線\u003c/strong\u003e，與台北市規劃中的社子捷運整合，從台北車站雙子星到淡海新市鎮，目標 15 分鐘到士北科、30 分鐘進台北核心區。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e我想，這不只是交通建設，是城市格局的重新安排。不是為了滿足今天，是為了布局未來三十年。\u003c/p\u003e","image":"https://firebasestorage.googleapis.com/v0/b/portaly-ca9e1.appspot.com/o/Ywf2Uj00rhhzoMmK7HZL%2FpagesBlocks%2FQevepcb4cOCfhHHpeqG5%2FitemMap.rJ4hLREHtTFxGb8y7MT8y.image?alt=media\u0026token=91c929d1-d7d4-4cbd-8f63-260653db2c23","itemId":"rJ4hLREHtTFxGb8y7MT8y","linkId":"xAvkrBwLt63FdqxU7kjn","text":"了解更多"}],"type":"collection","updatedAt":{"_nanoseconds":983000000,"_seconds":1788327046}},"ROjMvkc4nQ6lfjOl4m4M":{"createdAt":{"_nanoseconds":945000000,"_seconds":1790749377},"hidden":false,"id":"ROjMvkc4nQ6lfjOl4m4M","initial":false,"items":[{"alt":"李四川交通政策","cta":true,"description":"\u003ch2 style=\"text-align:left\"\u003e\u003cstrong\u003e李四川拚交通\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003e說實在，做工程做了四十多年。路蓋了不少，橋也接了幾座，三環三線就是這樣一段一段接起來的。做到後來，我越來越確定一件事：交通建設最後看的，不只是蓋了多少路、多少橋。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e路是手段，人才是目的，最重要的是市民出門有沒有更方便，上班上學有沒有少花一點時間，一家人出門，能不能平平安安回家。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e三環三線到四環八線，新北的基礎已經打好。下一步不是另起爐灶，是接上去、打得通、做得更安全。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e30 分鐘更快，雙北核心生活圈：\u003c/strong\u003e雙北本來就是一塊，路網不該在市界斷掉。建立「北北基桃四市首長級跨域治理平台」一起規劃，捷運、公車、國道一起看；淡江大橋接桃園機場，智駕電巴示範廊道；雙北自行車通勤網，跨河不斷點。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e15 分鐘更近，車站為中心的日常生活圈：\u003c/strong\u003e人本友善城市委員會先成立，整合交通、捷運、都市規劃與公共空間。車站、學校、醫院、市場走出來，人行道要接得起來。人行斷點優先打通；停車往路外移，停車有地方，行人有路走。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e零死亡願景，更安心：\u003c/strong\u003e以人為本，一條一條路做出來。道路設計、速限、路口、號誌一個一個改，高風險路段先處理；AI 動態號誌、車路協同，救護車先過，公車準時。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e交通少塞一點，市民就多一點時間。\u003c/p\u003e\u003cp\u003e道路安全一點，家人就多一點安心。\u003c/p\u003e\u003cp\u003e這就是我拚交通最重要的目的。\u003c/p\u003e","image":"https://firebasestorage.googleapis.com/v0/b/portaly-ca9e1.appspot.com/o/Ywf2Uj00rhhzoMmK7HZL%2FpagesBlocks%2FROjMvkc4nQ6lfjOl4m4M%2FitemMap.yJHI13KAV0VP_g2A13JiY.image?alt=media\u0026token=3dd3fd02-92e9-46ca-90dc-db1efbdfd782","itemId":"yJHI13KAV0VP_g2A13JiY","linkId":"no9OFrgTBMaqMrTh3q9V","originalIndex":0,"text":"了解更多"}],"type":"collection","updatedAt":{"_nanoseconds":255000000,"_seconds":1790749486}},"WxnuRk1bzHMudDwCUNwo":{"createdAt":{"_nanoseconds":523000000,"_seconds":1789375975},"hidden":false,"id":"WxnuRk1bzHMudDwCUNwo","initial":false,"items":[{"alt":"李四川居住政策","cta":true,"description":"\u003ch2 style=\"text-align:left\"\u003e\u003cstrong\u003e居住新五箭\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e我做了一輩子工程，蓋過路、蓋過橋、蓋過捷運。但這幾年我一直在想一件事——路通了，人還是要有地方可以回去。那個地方，才叫家。新北，有很多有理想的年輕人一起來打拚，我們要做的，是讓他們安心落腳。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e說實在，過去八年侯友宜市長一步一腳印，把都更跟社會住宅的底子打下來。我接著走，不是重來，是往上疊。新北 3.9 萬戶社會住宅，我接著蓋完，也會把新北該有的份額爭回來。各界好的方案我都納進來評估，包括民眾黨提出的 1.2 萬戶規劃，住宅這件事，不分黨派。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e然後是「居住新五箭」🏹🏹🏹\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e捷運到哪，安居到哪：\u003c/strong\u003e淡海二三期、大柑園、麥仔園，規劃 5% 以上土地留給社會住宅。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e有開發，就有社宅：\u003c/strong\u003e利用容積獎勵，取得社宅回饋。城市發展的紅利，要回到市民身上。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e企業一起蓋勞工宅：\u003c/strong\u003e只租不賣，留人也留才。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e婚育宅再加碼：\u003c/strong\u003e兩個孩子以上的家庭，研議把社宅住得更久，租金階梯往下走。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e高齡友善社宅：\u003c/strong\u003e延續「銀新未來城」，讓長輩住在醫院附近、菜市場走得到的地方。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e我想，住宅政策最怕的就是只剩數字。一戶社宅，對市府是一個數字；對一個家庭，是終於敢把行李箱放下來。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e當然，能安居的前提是安全。「都更 5 夠力」加速老屋、危樓更新，這一關同步在走。捷運到哪，安居到哪。房子要蓋在有生活的地方，那才叫家。\u003c/p\u003e","image":"https://firebasestorage.googleapis.com/v0/b/portaly-ca9e1.appspot.com/o/Ywf2Uj00rhhzoMmK7HZL%2FpagesBlocks%2FWxnuRk1bzHMudDwCUNwo%2FitemMap.ZQUFJPaOyLVJQj8eSfYZc.image?alt=media\u0026token=762b50b6-bb7f-4b13-a4db-5eac249820f7","itemId":"ZQUFJPaOyLVJQj8eSfYZc","linkId":"IBUGl7M9xVwEqpApoVRf","originalIndex":0,"text":"了解更多"}],"type":"collection","updatedAt":{"_nanoseconds":489000000,"_seconds":1789376163}}},"id":"S1L5BLCBf5jZQo3YPt5R","index":2,"schemaVersion":1,"slug":"construction","title":"交通建設與區域發展","type":"collection","updatedAt":{"_nanoseconds":31000000,"_seconds":1788326897}},"XWDVv6WPnkiomU3z0btJ":{"blockOrders":["WxonVMMiF0ujHXcABchw"],"blocks":{"WxonVMMiF0ujHXcABchw":{"createdAt":{"_nanoseconds":194000000,"_seconds":1790934086},"id":"WxonVMMiF0ujHXcABchw","items":[{"cta":false,"description":"\u003cp\u003e說實在，看到小朋友玩得開心，大人的心情也會跟著好起來。我們小時候玩石頭、玩泥巴，現在的小朋友，需要一個可以放心玩的地方。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e排隊、輪流、玩完把東西收好，這些事玩著玩著就學會了。這次的親子派對，有遊戲室，也有旋轉木馬。各位老師、各位爸爸媽媽，歡迎帶小朋友來玩。\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e📍 新北市板橋區三民路一段129號之1\u003c/p\u003e\u003cp\u003e👉 團體預約：兒童閱覽室\u003c/p\u003e\u003cp\u003e\u003ca href=\"https://forms.gle/ABnrWe6ndpg57tKdA\"\u003ehttps://forms.gle/ABnrWe6ndpg57tKdA\u003c/a\u003e\u003c/p\u003e\u003cp\u003e\u003ca href=\"https://forms.gle/ABnrWe6ndpg57tKdA\"\u003e\u003c/a\u003e\u003c/p\u003e\u003cp\u003e👉 團體預約：旋轉木馬\u003c/p\u003e\u003cp\u003e\u003ca href=\"https://forms.gle/4ChPE4jD92qxuqU49\"\u003ehttps://forms.gle/4ChPE4jD92qxuqU49\u003c/a\u003e\u003c/p\u003e","image":"https://firebasestorage.googleapis.com/v0/b/portaly-ca9e1.appspot.com/o/Ywf2Uj00rhhzoMmK7HZL%2FpagesBlocks%2FWxonVMMiF0ujHXcABchw%2FitemMap.kIdCGMP-bNTXy1o8xzfs4.image?alt=media\u0026token=e9f38ea6-7378-4442-b747-21c057aa7cbe","itemId":"kIdCGMP-bNTXy1o8xzfs4","text":"了解更多"}],"type":"collection","updatedAt":{"_nanoseconds":475000000,"_seconds":1790934199}}},"id":"XWDVv6WPnkiomU3z0btJ","index":7,"schemaVersion":1,"slug":"childparty","title":"李四川親子派對","type":"collection"}},"personalTag":{"tag1":"","tag2":"","tag3":""},"qrcode":{"image":"https://firebasestorage.googleapis.com/v0/b/portaly-ca9e1.appspot.com/o/Ywf2Uj00rhhzoMmK7HZL%2Fqrcode.image?alt=media\u0026token=a123b70f-e12b-47b3-add7-71a74764ca37"},"showFavorite":true,"showQrCode":true,"showShare":true,"slug":"hammerlee","social":{"links":{"facebook":"https://www.facebook.com/p/%E6%9D%8E%E5%9B%9B%E5%B7%9DHammer-Lee-100051818071280","instagram":"https://www.instagram.com/hammer__lee","threads":"https://www.threads.com/@hammer__lee","tiktok":"https://www.tiktok.com/@hammer__lee","youtube":"https://www.youtube.com/channel/UC4rvD7m357E39cUjpPbTr1g"},"orders":["facebook","instagram","threads","youtube","tiktok"],"variant":"ghost"},"src
