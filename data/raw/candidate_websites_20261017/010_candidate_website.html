02:02Z\",\"_id\":\"f6b9ac93-dc6f-4fdf-a54f-4915e59492ee\",\"_type\":\"campaignFeed\",\"_updatedAt\":\"2026-07-13T11:19:01Z\",\"body\":[{\"_key\":\"intro\",\"_type\":\"block\",\"children\":[{\"_key\":\"introText\",\"_type\":\"span\",\"marks\":[],\"text\":\"從南投市一路掃街到草屯，一天走了三萬多步，沒想到還沒中暑，卻先被狗咬傷。平常是替大家看診的醫師，這次角色互換，坐上急診病床，也更直接感受到病人面對突發狀況時的不安。\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"quote\",\"_type\":\"block\",\"children\":[{\"_key\":\"quoteText\",\"_type\":\"span\",\"marks\":[],\"text\":\"還好當時人在草屯，附近就有佑民醫院；如果是在南投更偏遠的地方，遇到同樣狀況，要去哪裡找醫師？\"}],\"markDefs\":[],\"style\":\"blockquote\"},{\"_key\":\"reflection\",\"_type\":\"block\",\"children\":[{\"_key\":\"reflectionText\",\"_type\":\"span\",\"marks\":[],\"text\":\"從清創、打針到包紮，醫療團隊迅速完成處置。這場意外讓我再次確定：好的醫療不該取決於住在哪裡。未來要讓遠距醫療、行動醫療與緊急救護真正走進偏鄉，縮短每一位鄉親與醫療資源之間的距離。\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"sources\",\"_type\":\"block\",\"children\":[{\"_key\":\"sourceLabel\",\"_type\":\"span\",\"marks\":[],\"text\":\"延伸閱讀：\"},{\"_key\":\"facebookText\",\"_type\":\"span\",\"marks\":[\"facebook\"],\"text\":\"温世政 Facebook\"},{\"_key\":\"separator\",\"_type\":\"span\",\"marks\":[],\"text\":\"、\"},{\"_key\":\"setnText\",\"_type\":\"span\",\"marks\":[\"setn\"],\"text\":\"三立新聞報導\"}],\"markDefs\":[{\"_key\":\"facebook\",\"_type\":\"link\",\"href\":\"https://www.facebook.com/wEnShihheng\"},{\"_key\":\"setn\",\"_type\":\"link\",\"href\":\"https://www.setn.com/News.aspx?NewsID=1861058\"}],\"style\":\"normal\"}],\"coverImage\":{\"alt\":null,\"asset\":{\"_ref\":\"image-eacbf9e4b361adf38815b3c5ebad57c59f7625aa-1350x974-jpg\",\"_type\":\"reference\"},\"crop\":null,\"hotspot\":null},\"eventDate\":null,\"isPinned\":false,\"location\":null,\"primaryMediaType\":\"image\",\"publishedAt\":\"2026-06-23T12:00:00+08:00\",\"seo\":{\"_type\":\"seo\",\"metaDescription\":\"温世政掃街拜票時意外受傷，從醫師成為病人，更深刻體會南投偏鄉醫療資源與緊急救護的重要性。\",\"metaTitle\":\"醫師也去看醫生｜温世政看見南投偏鄉醫療距離\",\"shareImage\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-eacbf9e4b361adf38815b
